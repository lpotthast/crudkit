[package]
name = "crudkit-leptos"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[features]
ssr = ["leptonic/ssr"]
hydrate = ["leptonic/hydrate"]

[dependencies]
crudkit-core = { path = "../crudkit-core" }
crudkit-core-macros = { path = "../crudkit-core-macros" }
crudkit-web = { path = "../crudkit-web" }
crudkit-web-macros = { path = "../crudkit-web-macros" }

dyn-clone = "1.0.20"
indexmap = { version = "2.12.1", features = ["serde"] }
icondata = "0.7.0"
leptonic = { path = "../../leptonic/leptonic", default-features = false, features = ["atoms"] }
leptos = "0.8.15"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.148", features = ["raw_value"] }
time = { version = "0.3.44", features = [
    "macros",
    "local-offset", # TODO: Describe why this feature is required.
    "wasm-bindgen",
] }
tracing = "0.1.44"
uuid = { version = "1.19.0", features = ["js", "v4", "v7", "serde"] }

[build-dependencies]
anyhow = "1.0.100"
cargo_toml = "0.22.3"
crudkit-leptos-theme = { path = "../crudkit-leptos-theme" }

[dev-dependencies]
assertr = "0.6.0"
typetag = "0.2.21"

# Dependencies of the native hook tests and their `test_support` module.
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
any_spawner = "0.3.0"
async-trait = "0.1.89"
futures = { version = "0.3.31", features = ["executor"] }
http = "1.4.0"
# Leptos only runs effects in client builds; tests need them too.
reactive_graph = { version = "0.2.15", features = ["effects"] }
reqwest = { version = "0.13.2", default-features = false, features = ["json"] }
