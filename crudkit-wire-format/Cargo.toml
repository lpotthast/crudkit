[package]
name = "crudkit-wire-format"
version = "0.1.0"
edition = "2024"

[dependencies]
indexmap = { version = "2.14.2", default-features = false, features = ["serde", "std"] }
serde = { version = "1.0.229", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1.0.151", default-features = false, features = ["alloc"] }
time = { version = "0.3.55", default-features = false, features = ["formatting", "macros", "parsing", "serde"] }
utoipa = { version = "6.0.0", default-features = false, features = ["macros", "time", "uuid"] }
uuid = { version = "1.27.0", default-features = false, features = ["serde"] }

[dev-dependencies]
assertr = { version = "0.7.1", default-features = false }
