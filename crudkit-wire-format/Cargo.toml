[package]
name = "crudkit-wire-format"
version = "0.1.0"
edition = "2024"

[dependencies]
indexmap = { version = "2.12.1", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"
time = { version = "0.3.44", features = ["macros", "serde", "serde-well-known"] }
utoipa = { version = "5.4.0", features = ["time", "uuid"] }
uuid = { version = "1.19.0", features = ["serde"] }

[dev-dependencies]
assertr = "0.6.0"
