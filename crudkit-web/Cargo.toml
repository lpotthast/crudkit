[package]
name = "crudkit-web"
version = "0.1.0"
edition = "2024"

[features]
default = []
keycloak-auth = ["dep:leptos-keycloak-auth"]

[dependencies]
crudkit-core = { path = "../crudkit-core" }
crudkit-core-macros = { path = "../crudkit-core-macros" }
crudkit-web-macros = { path = "../crudkit-web-macros" }
crudkit-wire-format = { path = "../crudkit-wire-format" }

downcast-rs = "2.0.1"
typetag = "0.2.19"
erased-serde = "0.4.5"
dyn-eq = "0.1.3"
dyn-hash = "0.2.1"
send_wrapper = { version = "0.6.0", features = ["futures"] }
leptos-keycloak-auth = { version = "0.12.0", optional = true }
async-trait = "0.1.71"
dyn-clone = "1.0.12"
indexmap = { version = "2.0.0", features = ["serde"] }
reqwest = { version = "0.13.2", default-features = false, features = [
    "json",
    "multipart",
] }
serde = { version = "1.0.171", features = ["derive", "rc"] }
serde_json = { version = "1.0.103", features = ["raw_value"] }
# TODO: Consider replacing this with `snafu`.
thiserror = "2.0.17"
time = { version = "0.3.23", features = [
    "macros",
    "local-offset",
    "wasm-bindgen",
] }
tracing = "0.1.37"

[dev-dependencies]
assertr = "0.6.0"
