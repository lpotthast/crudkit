[package]
name = "crudkit-web"
version = "0.1.0"
edition = "2024"

[features]
default = []
keycloak-auth = ["dep:leptos-keycloak-auth"]

[dependencies]
crudkit-core = { path = "../crudkit-core", default-features = false }
crudkit-core-macros = { path = "../crudkit-core-macros", default-features = false }
crudkit-web-macros = { path = "../crudkit-web-macros", default-features = false }
crudkit-wire-format = { path = "../crudkit-wire-format", default-features = false }

downcast-rs = { version = "2.0.2", default-features = false }
typetag = { version = "0.2.23", default-features = false }
erased-serde = { version = "0.4.10", default-features = false }
dyn-eq = { version = "0.1.3", default-features = false, features = ["alloc"] }
dyn-hash = { version = "1.0.0", default-features = false }
send_wrapper = { version = "0.6.0", default-features = false, features = ["futures"] }
leptos-keycloak-auth = { version = "0.13.0", default-features = false, optional = true }
async-trait = { version = "0.1.92", default-features = false }
dyn-clone = { version = "1.0.20", default-features = false }
indexmap = { version = "2.14.2", default-features = false, features = ["serde", "std"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "multipart"] }
serde = { version = "1.0.229", default-features = false, features = ["alloc", "derive", "rc"] }
serde_json = { version = "1.0.151", default-features = false, features = ["alloc"] }
# TODO: Consider replacing this with `snafu`.
thiserror = { version = "2.0.21", default-features = false }
time = { version = "0.3.55", default-features = false, features = ["macros", "formatting", "parsing"] }
tracing = { version = "0.1.44", default-features = false }

[dev-dependencies]
assertr = { version = "0.7.1", default-features = false }
