[package]
name = "crudkit-rs"
version = "0.1.0"
edition = "2024"

[features]
default = []
keycloak-auth = ["dep:axum-keycloak-auth"]

[dependencies]
crudkit-core = { path = "../crudkit-core", default-features = false }
crudkit-core-macros = { path = "../crudkit-core-macros", default-features = false }
crudkit-rs-macros = { path = "../crudkit-rs-macros", default-features = false }
crudkit-wire-format = { path = "../crudkit-wire-format", default-features = false }

async-trait = { version = "0.1.92", default-features = false }
axum = { version = "0.8.9", default-features = false, features = ["json"] }
axum-keycloak-auth = { version = "0.8.3", default-features = false, optional = true }
error-stack = { version = "0.8.0", default-features = false }
indexmap = { version = "2.14.2", default-features = false, features = ["serde", "std"] }
paste = { version = "1.0.15", default-features = false }
serde = { version = "1.0.229", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1.0.151", default-features = false, features = ["alloc"] }
snafu = { version = "0.9.2", default-features = false, features = ["std"] }
time = { version = "0.3.55", default-features = false }
tracing = { version = "0.1.44", default-features = false, features = ["attributes"] }
utoipa = { version = "6.0.0", default-features = false }
uuid = { version = "1.27.0", default-features = false }
