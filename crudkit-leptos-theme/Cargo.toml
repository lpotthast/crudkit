[package]
name = "crudkit-leptos-theme"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
authors = ["Lukas Potthast <privat@lukas-potthast.de>"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/lpotthast/crudkit-leptos-scss"
description = """
Theme builder for the Crudkit component library.
"""
categories = ["gui"]
keywords = ["leptos", "crudkit", "styling", "theme", "css"]

[dependencies]
include_dir = { version = "0.7.4", default-features = false }
anyhow = { version = "1.0.104", default-features = false }
indoc = { version = "2.0.7", default-features = false }
