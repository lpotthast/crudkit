[package]
name = "crudkit-core"
version = "0.1.0"
edition = "2024"

[dependencies]
crudkit-wire-format = { path = "../crudkit-wire-format", default-features = false }

# Core utilities.
dyn-clone = { version = "1.0.20", default-features = false }
paste = { version = "1.0.15", default-features = false }
dyn-eq = { version = "0.1.3", default-features = false }
indexmap = { version = "2.14.2", default-features = false, features = ["serde", "std"] }
serde = { version = "1.0.229", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1.0.151", default-features = false, features = ["alloc"] }
thiserror = { version = "2.0.21", default-features = false }
typetag = { version = "0.2.23", default-features = false }

# Ecosystem support.
time = { version = "0.3.55", default-features = false, features = ["formatting", "parsing"] }
utoipa = { version = "6.0.0", default-features = false }
uuid = { version = "1.27.0", default-features = false }

[dev-dependencies]
assertr = { version = "0.7.1", default-features = false }
