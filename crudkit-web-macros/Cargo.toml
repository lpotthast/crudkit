[package]
name = "crudkit-web-macros"
version = "0.1.0"
edition = "2024"
autotests = false

[lib]
proc-macro = true

[[test]]
name = "tests"
path = "tests/progress.rs"

[dependencies]
crudkit-core-macro-util = { path = "../crudkit-core-macro-util", default-features = false }

darling = { workspace = true }
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true }

[dev-dependencies]
crudkit-web = { path = "../crudkit-web", default-features = false }
serde = { version = "1.0.229", default-features = false, features = ["alloc", "derive"] }
trybuild = { version = "1.0.121", default-features = false, features = ["diff"] }
